name: Daily Tieba Sign-In

on:
  workflow_dispatch:
  schedule:
    # 北京时间 6:40 (UTC+8)
    - cron: '40 22 * * *'
    # 北京时间 18:40 (UTC+8)，冗余兜底
    - cron: '40 10 * * *'

jobs:
  signin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'
          cache: 'maven'

      - name: Build and execute
        env:
          BDUSS: ${{ secrets.BDUSS }}
          SCKEY: ${{ secrets.SCKEY }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          mvn -B compile exec:java \
            -Dexec.mainClass="top.srcrs.Run" \
            -Dexec.args="$BDUSS $SCKEY"

      - name: Refresh cron schedule
        if: always()
        run: |
          f=.github/workflows/tieba.yml
          m=$((RANDOM % 60))
          python3 - "$f" "$m" <<'PY'
          import re, sys
          path, minute = sys.argv[1], sys.argv[2]
          text = open(path, encoding="utf-8").read()
          open(path, "w", encoding="utf-8").write(
              re.sub(r"(cron: ')\d+", lambda mo: mo.group(1) + minute, text))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          if git diff --cached --quiet; then
            echo "cron 未变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: refresh cron $(date -u +%FT%TZ)"
          git push
